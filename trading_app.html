
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過去トレ記録シート</title>
<style>
:root{
  --blue:#1565C0;--blue-lt:#E3F2FD;--blue-md:#90CAF9;
  --red:#C62828;--red-lt:#FFEBEE;--red-md:#EF9A9A;
  --orange:#E65100;--orange-lt:#FFF3E0;
  --green:#2E7D32;--green-lt:#E8F5E9;
  --purple:#6A1B9A;--purple-lt:#F3E5F5;
  --warn:#F57F17;--warn-lt:#FFF8E1;
  --gray:#546E7A;--gray-lt:#ECEFF1;
  --border:#CFD8DC;
  --bg:#F0F4F8;--card:#FFF;--text:#1A2332;--sub:#607D8B;--muted:#B0BEC5;
  --shadow:0 1px 4px rgba(0,0,0,.10);
  --font:'Meiryo','Hiragino Sans','Yu Gothic UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:12px;min-width:920px}
.app{max-width:1600px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.ch{padding:8px 14px;font-weight:700;font-size:12.5px;background:#F5F7FA;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb{padding:10px 14px}
.ctrl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px}
.ctrl{display:flex;align-items:center;gap:5px;white-space:nowrap}
.ctrl label{font-weight:700;font-size:12px;color:var(--sub)}
input[type=number],input[type=text]{font-family:var(--font);font-size:12px;border:1.5px solid var(--border);border-radius:5px;padding:4px 7px;background:#fff;color:var(--text);transition:border-color .15s}
input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--blue)}
textarea{font-family:var(--font);font-size:11px;border:1.5px solid var(--border);border-radius:5px;padding:6px;resize:vertical;color:var(--text)}
textarea:focus{outline:none;border-color:var(--blue)}
.btn{font-family:var(--font);font-size:12px;padding:5px 13px;border:none;border-radius:5px;cursor:pointer;font-weight:700;transition:filter .1s,transform .08s}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.btn:not(:disabled):active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--sub)}
.btn-outline:hover{background:var(--gray-lt)}
.btn-sm{padding:3px 9px;font-size:11px}
.btn-xs{padding:1px 6px;font-size:10.5px;border-radius:4px}
.layout{display:flex;gap:10px;align-items:flex-start;min-width:0}
.left-panel{flex:1 1 auto;min-width:0;overflow-x:hidden}
.right-panel{flex:0 0 540px;width:540px;min-width:540px}
.memo-sticky{position:sticky;top:10px;align-self:flex-start}

/* TABLE */
.table-wrap{overflow-x:auto}
table.trade{border-collapse:collapse;font-size:11px}
table.trade th,table.trade td{border:1px solid var(--border);padding:3px 6px;text-align:center;vertical-align:middle;white-space:nowrap}
table.trade th{background:#F5F7FA;font-weight:700;color:var(--sub);font-size:11px}
table.trade tr:hover td{background:#FAFCFF}
table.trade tr.row-ryodate td{background:#F3E5F5!important}
table.trade tr.row-ryodate:hover td{background:#EDE7F6!important}
.cd{width:58px}.cp{width:66px}.cdf{width:58px}.cob{width:32px}.cos{width:32px}
.cs{width:260px;text-align:left!important}.cpr{width:80px}.cpd{width:72px}.chl{width:90px}


/* ORDER BTN */
.ord-btn{width:26px;height:24px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;font-size:14px;font-weight:900;background:#FAFAFA;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.ob{background:var(--red-lt)!important;border-color:var(--red)!important;color:var(--red)!important}
.os{background:var(--blue-lt)!important;border-color:var(--blue)!important;color:var(--blue)!important}

/* PRICE */
.ph{color:transparent;background:#E8EDF2;border-radius:3px;padding:0 4px;user-select:none}
.up{color:var(--red);font-weight:700}
.dn{color:var(--blue);font-weight:700}

/* SETTLE */
.sl{font-size:10.5px}
.si{display:flex;align-items:center;gap:4px;padding:2px 0;border-bottom:1px solid #F0F4F8;flex-wrap:wrap}
.si:last-child{border-bottom:none}
.si.auto-si{background:var(--warn-lt);border-radius:4px;padding:2px 4px;margin:1px 0;border:1px solid #FFE082}
.tb{color:var(--red);font-weight:900}
.ts{color:var(--blue);font-weight:900}
.brm{background:none;border:none;cursor:pointer;color:var(--muted);font-size:10px;padding:0 2px;transition:color .1s}
.brm:hover{color:var(--red)}
.auto-tag{font-size:9px;background:var(--warn-lt);color:var(--warn);border:1px solid #FFE082;border-radius:3px;padding:0 3px;font-weight:700}
.expiry-warn{font-size:9px;color:var(--red);font-weight:700;background:var(--red-lt);border-radius:3px;padding:1px 4px;display:inline-block;margin-left:2px}
.ryodate-tag{font-size:9px;background:var(--purple-lt);color:var(--purple);border-radius:3px;padding:0 3px;border:1px solid #CE93D8;font-weight:700}

/* SETTLE FORM */
.sf{background:var(--orange-lt);border:1.5px solid #FFCC80;border-radius:6px;padding:7px 9px;margin-top:4px;font-size:10.5px}
.sf .pl{border:1px solid var(--border);border-radius:4px;max-height:150px;overflow-y:auto;margin-bottom:6px;background:#fff}
.rule3-warn{background:var(--warn-lt);border:2px solid #FFB300;border-radius:6px;padding:6px 10px;margin-top:4px;font-size:11px;color:var(--warn);font-weight:700}
.rule3-ok{font-size:10px;color:var(--green);background:var(--green-lt);border-radius:3px;padding:1px 5px;margin-left:4px}
.rule3-ng{font-size:10px;color:var(--red);background:var(--red-lt);border-radius:3px;padding:1px 5px;margin-left:4px}
.pi2{padding:3px 10px;cursor:pointer;display:flex;gap:7px;align-items:center;flex-wrap:nowrap;white-space:nowrap;border-bottom:1px solid #F5F7FA;transition:background .1s}
.pi2:last-child{border-bottom:none}
.pi2:hover{background:#F5F7FA}
.pi2.sel{background:var(--blue-lt)}
.pi2.expiring{background:#FFF8E1}
.sf .row2{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sf .row2 input{width:90px}
.sf .btns{display:flex;gap:6px}
.ppos{color:var(--red);font-weight:700}
.pneg{color:var(--blue);font-weight:700}

/* MEMO GRID */
.memo-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 14px;background:#F5F7FA;border-bottom:1px solid var(--border)}
.memo-title{font-size:13px;font-weight:700}
.memo-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.memo-meta input{width:78px}
.g-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 14px;min-width:380px}
.gc{border:2px solid var(--border);border-radius:7px;overflow:hidden;font-size:10px;transition:border-color .2s,box-shadow .2s}
.gc.cur{border-color:var(--orange)!important;box-shadow:0 0 0 3px #FF980033}
.gc.done{border-color:#A5D6A7}
.gh{background:#F5F7FA;padding:3px 7px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);font-size:11px}
.gc.cur .gh{background:var(--orange-lt)}
.gc.done .gh{background:var(--green-lt);color:var(--green)}
.gc-cols{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
.gch{text-align:center;padding:2px 3px;font-weight:700;font-size:10px}
.gch.buy{color:var(--red);border-right:1px solid var(--border)}
.gch.sell{color:var(--blue)}
.gc-rows{display:grid;grid-template-columns:1fr 1fr}
.gcol{display:flex;flex-direction:column}
.gcol:first-child{border-right:1px solid #E8EDF2}
.ge{min-height:22px;padding:2px 5px;border-bottom:1px solid #F0F4F8;display:flex;flex-direction:column;justify-content:center}
.ge:last-child{border-bottom:none}
.ge.stl{text-decoration:line-through;color:var(--muted)!important;background:#FAFCFF}
.ge.stl .gep,.ge.stl .ged{color:var(--muted)!important}
.ge.stl .ge-fukumi{color:inherit!important;text-decoration:line-through}
.ge.auto-stl{background:#FFF8E1!important}
/* 持ち越しスタイル */
.ge.ge-carry{background:#F0FFF4!important;border-left:2px solid #81C784}
.ge-carry-badge{font-size:8px;color:var(--green);font-weight:700;line-height:1;margin-bottom:1px}
.badge-carry{background:#E8F5E9;color:var(--green);border:1px solid #A5D6A7}
.ged{font-size:9px;color:var(--sub)}
.gep{font-weight:700;font-size:10.5px}
.ge.buy-e .gep{color:var(--red)}
.ge.sell-e .gep{color:var(--blue)}
.ge-exp{font-size:8px;color:var(--warn);font-weight:700}
.ge-fukumi{font-size:9px;font-weight:700;line-height:1.2}

/* BOTTOM */
.bot-row{display:flex;gap:10px;flex-wrap:wrap}
.bot-row .card{flex:1;min-width:190px}
.total-bar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:11px 18px}
.tc{display:flex;align-items:center;gap:8px}
.tc label{font-weight:700;white-space:nowrap;font-size:12px}
.tc input{width:115px;text-align:right}
.tbig{font-size:16px;font-weight:700}
.op{font-size:20px;font-weight:700;color:var(--muted)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:5px}
.pi3{display:flex;align-items:center;gap:4px;font-size:11px}
.pi3 label{min-width:38px;color:var(--sub)}
.pi3 input{width:66px}

/* IMPORT（ペーストのみ） */
.imp-paste-area{width:100%;height:110px;font-size:11px;font-family:var(--mono,'Courier New',monospace)}
.imp-hint{font-size:10px;color:var(--sub);margin-bottom:6px;line-height:1.6}
.imp-stat{font-size:11px;padding:6px 10px;border-radius:5px;margin-top:8px;font-weight:700}
.imp-stat.ok{background:var(--green-lt);color:var(--green)}
.imp-stat.err{background:var(--red-lt);color:var(--red)}
.imp-stat.warn{background:var(--warn-lt);color:var(--warn)}
.imp-preview{max-height:80px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;margin-top:6px;font-size:10px}
.imp-prow{display:flex;gap:12px;padding:2px 8px;border-bottom:1px solid #F5F7FA}
.imp-prow:last-child{border-bottom:none}
.imp-prow:nth-child(even){background:#FAFBFC}
.mono{font-family:var(--mono,'Courier New',monospace)}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700}
.badge-orange{background:var(--orange-lt);color:var(--orange)}
.badge-green{background:var(--green-lt);color:var(--green)}
.tag-note{font-size:10px;color:var(--sub);background:var(--gray-lt);border-radius:4px;padding:1px 6px}

/* EXPIRE BANNER */
.expire-banner{background:var(--warn-lt);border:2px solid #FFB300;border-radius:8px;padding:9px 14px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--warn);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.expire-banner .items{font-weight:400;font-size:11px;color:var(--text)}

/* FIXED REVEAL BUTTON */
.fixed-reveal{position:fixed;bottom:22px;right:22px;z-index:1000;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.fixed-reveal .btn{box-shadow:0 3px 10px rgba(0,0,0,.22);font-size:13px;padding:9px 18px}
.fixed-reveal .rev-info{font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:2px 8px;white-space:nowrap}

/* KOSAI FIXED */
.kf-section{padding:8px 14px;border-bottom:1px solid var(--border)}
.kf-title{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.kf-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;flex-wrap:wrap}
.kf-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.kf-rieki{background:var(--green-lt);color:var(--green);border:1px solid #A5D6A7}
.kf-son{background:var(--red-lt);color:var(--red);border:1px solid var(--red-md)}
.kf-doji{background:var(--gray-lt);color:var(--gray);border:1px solid var(--border)}
.kf-amount{font-size:13px;font-weight:700}
.kf-desc{font-size:10px;color:var(--sub);line-height:1.5}
.progress-bar{height:10px;background:#E8EDF2;border-radius:5px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:5px;transition:width .3s}
.jisa-row{display:flex;align-items:center;gap:6px;padding:2px 5px;font-size:10.5px;border-bottom:1px solid #F5F7FA}
.jisa-row:last-child{border-bottom:none}

/* SOSAI */
.sosai-wrap{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px}
.sosai-group{flex:1;min-width:160px;max-width:100%}
.sosai-group-title{font-size:11px;font-weight:700;color:var(--sub);background:#F5F7FA;padding:3px 8px;border-radius:5px;margin-bottom:4px;border-left:3px solid var(--blue);cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.sosai-group-title:hover{background:#EEF2F6}
.sosai-body{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;background:#fff}
.sosai-row{display:flex;align-items:center;gap:5px;padding:2px 5px;border-bottom:1px solid #F0F4F8;font-size:10.5px;flex-wrap:nowrap}
.sosai-row:last-child{border-bottom:none}
.sosai-row:hover{background:#FAFCFF}
.sosai-lbl{font-weight:700;color:var(--sub);min-width:30px;font-size:10px;flex-shrink:0}
.sosai-pos{display:flex;align-items:center;gap:2px;flex:1;flex-wrap:wrap;font-size:10px}
.sosai-res{font-size:11px;font-weight:700;text-align:right;min-width:72px;white-space:nowrap;flex-shrink:0}
.sosai-ok{color:var(--green)}
.sosai-ng{color:var(--red)}
.sosai-fix{font-size:9px;margin-left:2px;font-weight:400}
.sosai-achieved{font-size:9px;color:var(--green);background:var(--green-lt);border-radius:3px;padding:1px 3px;margin-left:2px}

/* PRED STATS */
.ps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:10px 14px}
.ps-card{border:1.5px solid var(--border);border-radius:7px;overflow:hidden}
.ps-head{padding:5px 10px;font-size:11px;font-weight:700;background:#F5F7FA;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.ps-body{padding:6px 10px}
.ps-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid #F5F7FA;font-size:11px}
.ps-row:last-child{border-bottom:none}
.ps-bar-wrap{height:8px;background:#E8EDF2;border-radius:4px;overflow:hidden;margin:3px 0}
.ps-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.ps-pct{font-size:14px;font-weight:900}
.ps-n{font-size:10px;color:var(--muted)}
.ps-rank-s{background:#FFF3E0;border-color:#FFCC80}
.ps-rank-a{background:#F3F8FF;border-color:#90CAF9}
.ps-rank-b{background:#F5F7FA;border-color:var(--border)}
.ps-timeline{padding:8px 14px;border-top:1px solid var(--border)}
.ps-trow{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:10px}
.ps-dot-ok{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.ps-dot-ng{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0}
.ps-dot-sk{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>/* ═══════════════════════ STATE ═══════════════════════ */
const S = {
  year:2025,month:1,stock:'',code:'',capital:'',shares:'',
  prices:{},revealed:0,
  // orders[dstr] = {buyId:number|null, sellId:number|null}
  orders:{},
  // settles[dstr] = [{id,posId,exitPrice,auto?}]
  settles:{},
  groups:mkGroups(),
  // carries[gi] = 移行時にスナップショットした未決済positionのIDリスト
  carries:Array.from({length:12},()=>[]),
  gi:0,idc:1,prOpen:false,
  sfDs:null,selPosArr:[],exitInp:'',
  fixedOpen:false,jisaOpen:false,
  rule3On:true,rule3Pct:3,
  prevP:'',memo:'',fukumi:'',

  // グループ別メモ
  groupMemos:Array.from({length:12},()=>''),
  // import
  impStat:null,
  pasteText:'',
  // 外部データ（予測精度向上用）
  extDow:{},   // NYダウ終値 {YYYY-MM-DD: 終値}
  extVol:{},   // 銘柄出来高 {YYYY-MM-DD: 出来高}
  dowPaste:'',volPaste:'',
  dowStat:null,volStat:null,
  // OHLCデータ {YYYY-MM-DD: {o,h,l,c}}
  extOHLC:{},ohlcPaste:'',ohlcStat:null,
  patternAnalysis:null, // 銘柄固有法則解析結果
  extMA:{},   // 銘柄MA {YYYY-MM-DD: {ma5,ma25,ma75}}
  // 統合入力
  stockPaste:'',stockStat:null,
  // リアルタイム入力（実トレード用）
  rtOpen:false,
  rtDate:'',rtO:'',rtH:'',rtL:'',rtC:'',rtVol:'',rtDow:'',rtStat:null,
  // 翌日予測履歴 {YYYY-MM-DD: {dir:'up'|'down', chop:number}}
  predLog:{},
  predStatsOpen:false
};

function mkGroups(){return Array.from({length:12},()=>({buys:[],sells:[]}))}

/* ═══════════════════════ HELPERS ═══════════════════════ */
const NUMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];

function wds(y,m){
  const r=[],d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){if(d.getDay()&&d.getDay()!==6)r.push(new Date(d));d.setDate(d.getDate()+1)}
  return r;
}
function ds(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function pad(n){return String(n).padStart(2,'0')}
function fd(s){if(!s)return '';const[,m,d]=s.split('-');return `${+m}/${+d}`}
function fn(n){if(n===''||n==null)return '';const v=Number(n);return isNaN(v)?'':v.toLocaleString('ja-JP')}

/* 6ヶ月後の日付文字列 */
function addM6(dstr){const d=new Date(dstr);d.setMonth(d.getMonth()+6);return ds(d)}
/* 期限切れ判定 — YYYY-MM-DD文字列は辞書順で日付比較可能なのでDate生成不要 */
function isExp(entryDstr,checkDstr){return checkDstr>=addM6(entryDstr)}

let C={};

function buildCache(){
  C.days=wds(S.year,S.month);
  C.lastD=S.revealed>0?ds(C.days[S.revealed-1]):null;
  C.sh=Math.max(Number(S.shares)||1,1);
  C.curP=C.lastD?(S.prices[C.lastD]||null):null;
  C.revDstrs=new Set(C.days.slice(0,S.revealed).map(d=>ds(d)));
  C.entryMap=new Map();
  for(const g of S.groups){
    for(const e of g.buys)C.entryMap.set(e.id,e);
    for(const e of g.sells)C.entryMap.set(e.id,e);
  }
  C.open=[];
  S.groups.forEach((g,gi)=>{
    for(const e of g.buys)if(!e.settled)C.open.push({...e,gi});
    for(const e of g.sells)if(!e.settled)C.open.push({...e,gi});
  });
  C.autoStlIds=new Set();
  C.settleExitMap=new Map();
  C.settleGiMap=new Map();
  for(const ss of Object.values(S.settles)){
    for(const s of ss){
      if(s.auto)C.autoStlIds.add(s.posId);
      if(!C.settleExitMap.has(s.posId))C.settleExitMap.set(s.posId,s.exitPrice);
      if(!C.settleGiMap.has(s.posId))C.settleGiMap.set(s.posId,s.settledGi!=null?s.settledGi:-1);
    }
  }
  C.monthHi=null;C.monthLo=null;
  C.revDstrs.forEach(function(d){
    var hi=S.extOHLC[d]?S.extOHLC[d].h:(S.prices[d]||null);
    var lo=S.extOHLC[d]?S.extOHLC[d].l:(S.prices[d]||null);
    if(hi&&(C.monthHi===null||hi>C.monthHi))C.monthHi=hi;
    if(lo&&(C.monthLo===null||lo<C.monthLo))C.monthLo=lo;
  });
}

  if(scoreDir==='up')votes.up+=scorePower;else votes.down+=scorePower;
  var bayesPower=Math.abs(bayesProb-50)>=20?2:1;
  if(bayesDir==='up')votes.up+=bayesPower;else votes.down+=bayesPower;
  if(sakata&&sakata.dir){var sakPower=Math.min(2,Math.abs(sakata.score));if(sakata.dir==='up')votes.up+=sakPower;else votes.down+=sakPower;}
  if(!maCrossType&&ma25AboveMa75!==null){if(ma25AboveMa75&&ma25Rising===true)votes.up+=1;else if(!ma25AboveMa75&&ma25Rising===false)votes.down+=1;}
  if(vd==='up') votes.down+=2;
  else if(vd==='down') votes.up+=2;
  if(isTrend&&n>=2){if(series[n-1]>series[n-2])votes.up+=1;else votes.down+=1;}

  if(accumSignal>0){votes.up+=2;}
  else if(accumSignal<0){votes.down+=2;}
  if(distributionSignal<0){votes.down+=3;}
  else if(distributionSignal>0){votes.up+=2;}
  if(vbpSignal>0){votes.up+=1;}
  else if(vbpSignal<0){votes.down+=1;}

  var patternLog=[];
  if(S.patternAnalysis&&S.patternAnalysis.n>=20){
    var pa=S.patternAnalysis;
    var todayChgPa=n>=2?(series[n-1]-series[n-2])/series[n-2]*100:0;
    var todayVolPa=hasVol?S.extVol[dates[n-1]]:null;
    var ohlcNow=S.extOHLC&&S.extOHLC[dates[n-1]]?S.extOHLC[dates[n-1]]:null;
    var todayO=ohlcNow?ohlcNow.o:series[n-1];
    var todayH=ohlcNow?ohlcNow.h:series[n-1];
    var todayL=ohlcNow?ohlcNow.l:series[n-1];
    var todayRange=todayH-todayL;
    var todayBody=Math.abs(series[n-1]-todayO);
    var todayUW=todayH-Math.max(todayO,series[n-1]);
    var gapPct=n>=2?(todayO-series[n-2])/series[n-2]*100:0;
    var isCont3Up=n>=4&&series[n-1]>series[n-2]&&series[n-2]>series[n-3]&&series[n-3]>series[n-4];
    var isCont3Dn=n>=4&&series[n-1]<series[n-2]&&series[n-2]<series[n-3]&&series[n-3]<series[n-4];
    var isWknd=false;
    if(n>=2&&dates[n-1]&&dates[n-2]){var _d0=new Date(dates[n-2]),_d1=new Date(dates[n-1]);isWknd=(_d1-_d0)/864e5>=3;}

    function pctToVotes(pct,name){
      if(pct===null)return;
      var upPct=pct,dnPct=100-pct;
      var dir,pw;
      if(upPct>=70){dir='up';pw=3;}
      else if(upPct>=62){dir='up';pw=2;}
      else if(upPct>=55){dir='up';pw=1;}
      else if(dnPct>=70){dir='down';pw=3;}
      else if(dnPct>=62){dir='down';pw=2;}
      else if(dnPct>=55){dir='down';pw=1;}
      else return;
      if(dir==='up'){votes.up+=pw;}else{votes.down+=pw;}
      patternLog.push({name:name,pct:upPct,dir:dir,pw:pw});
    }

    pa.items.forEach(function(item){
      var matched=false;
      var nm=item.name;
      if(nm==='異常出来高＋当日上昇')matched=pa.hasVol&&pa.avgVol>0&&todayVolPa&&todayVolPa/pa.avgVol>=2.0&&todayChgPa>=0;
      else if(nm==='異常出来高＋当日下落')matched=pa.hasVol&&pa.avgVol>0&&todayVolPa&&todayVolPa/pa.avgVol>=2.0&&todayChgPa<0;
      else if(nm==='大陽線（＋2%超）')matched=todayChgPa>=2.0;
      else if(nm==='大陰線（－2%超）')matched=todayChgPa<=-2.0;
      else if(nm==='値幅大＋当日上昇')matched=pa.avgRange>0&&todayRange>=pa.avgRange*1.5&&todayChgPa>0;
      else if(nm==='上窓あき（＋2%超）')matched=gapPct>=2.0;
      else if(nm==='下窓あき（－2%超）')matched=gapPct<=-2.0;
      else if(nm==='上ヒゲ大（実体比2倍）')matched=todayBody>5&&todayUW>=todayBody*2;
      else if(nm==='連続3日上昇後')matched=isCont3Up;
      else if(nm==='連続3日下落後')matched=isCont3Dn;
      else if(nm==='週またぎ翌日')matched=isWknd;
      if(matched)pctToVotes(item.pct,nm);
    });
  }

  var totalVotes=votes.up+votes.down;
  var finalDir=votes.up>=votes.down?'up':'down';
  var winVotes=Math.max(votes.up,votes.down);
  var stars=winVotes/totalVotes>=0.68?3:winVotes/totalVotes>=0.52?2:1;
  if(totalHist<10&&stars===3)stars=2;

  var patternBoost=false;
  if(patternLog.length>0){
    var sRank=patternLog.filter(function(p){return p.pw>=3;});
    var aRank=patternLog.filter(function(p){return p.pw>=2;});
    if(sRank.length>=2){stars=3;patternBoost=true;}
    else if(sRank.length>=1){if(stars<2)stars=2;patternBoost=true;}
    else if(aRank.length>=2){if(stars<2)stars=2;patternBoost=true;}
    else if(aRank.length>=1){patternBoost=true;}
  }

  var ma5Now2=ma5extv(n-1),ma25Now2=ma25v(n-1),ma75Now2=ma75v(n-1);
  var closeNow=series[n-1];
  var maPosition=null;
  if(ma5Now2&&ma25Now2&&ma75Now2&&closeNow){
    var aboveAll=closeNow>ma5Now2&&ma5Now2>ma25Now2&&ma25Now2>ma75Now2;
    var belowAll=closeNow<ma5Now2&&ma5Now2<ma25Now2&&ma25Now2<ma75Now2;
    var aboveMa25=closeNow>ma25Now2;
    var nearMa25=Math.abs(closeNow-ma25Now2)/ma25Now2*100<=1.5;
    if(ma25Rising&&ma75Rising&&aboveAll) maPosition='perfect_up';
    else if(!ma25Rising&&!ma75Rising&&belowAll) maPosition='perfect_down';
    else if(nearMa25&&ma25Rising!==false) maPosition='near_ma25';
    else if(aboveMa25) maPosition='above_ma25';
    else maPosition='below_ma25';
  }
  var osimePullback=false;
  if(ma25Rising===true&&ma25AboveMa75===true&&ma25Now2&&closeNow){
    var devFromMa25=(closeNow-ma25Now2)/ma25Now2*100;
    var recentDown=n>=3&&series[n-1]<series[n-2]&&series[n-2]<=series[n-3];
    var closingInOnMa25=devFromMa25>=0&&devFromMa25<=3.0;
    if(closingInOnMa25&&recentDown) osimePullback=true;
  }
  var modoriSell=false;
  if(ma25Rising===false&&ma25AboveMa75===false&&ma25Now2&&closeNow){
    var devFromMa25d=(ma25Now2-closeNow)/ma25Now2*100;
    var recentUp=n>=3&&series[n-1]>series[n-2]&&series[n-2]>=series[n-3];
    var closingInOnMa25d=devFromMa25d>=0&&devFromMa25d<=3.0;
    if(closingInOnMa25d&&recentUp) modoriSell=true;
  }
  var ma25Dev=ma25Now2&&closeNow?Math.round((closeNow-ma25Now2)/ma25Now2*1000)/10:null;

  return{
    dir:finalDir,stars:stars,score:scoreAdj,bayesProb:bayesProb,sakata:sakata,
    chop:chopLevel,isRange:isRange,votes:votes,rsi:rsiVal?Math.round(rsiVal):null,
    bbPos:bbVal?bbVal.pos:null,maCross:maCrossType,ma25AboveMa75:ma25AboveMa75,
    ma25Rising:ma25Rising,ma75Rising:ma75Rising,atrPct:atrPct,isTrend:isTrend,isQuiet:isQuiet,
    volDir:vd,patternLog:patternLog,patternBoost:patternBoost,accumSignal:accumSignal,
    distributionSignal:distributionSignal,vbpSignal:vbpSignal,votesUp:votes.up,votesDown:votes.down,
    scoreItems:scoreItems,maPosition:maPosition,osimePullback:osimePullback,modoriSell:modoriSell,
    ma25Dev:ma25Dev,ma5Now:ma5Now2,ma25Now:ma25Now2,ma75Now:ma75Now2
  };
}

    5:{label:'買い優勢',emoji:'📈',cl:'var(--red)',fw:'900',sz:'12px'},
    4:{label:'やや強気',emoji:'🔼',cl:'var(--red)',fw:'700',sz:'11px'},

  };
  var lv;

function checkAutoSettle(revDstr){
  const ep=S.prices[revDstr];
  S.groups.forEach((g,gIdx)=>{
    for(const arr of[g.buys,g.sells]){
      for(const e of arr){
        if(e.settled||!isExp(e.date,revDstr))continue;
        if(!S.settles[revDstr])S.settles[revDstr]=[];
        if(S.settles[revDstr].some(x=>x.posId===e.id))continue;
        S.settles[revDstr].push({id:S.idc++,posId:e.id,exitPrice:ep,auto:true,settledGi:gIdx});
        e.settled=true;
      }
    }
  });
}

function snapshotCarries(fromGi, toGi){
  if(toGi>=12)return;
  const ownIds=[...S.groups[fromGi].buys,...S.groups[fromGi].sells].map(e=>e.id);
  const carriedIds=S.carries[fromGi]||[];
  const allIds=[...new Set([...carriedIds,...ownIds])];
  const unsettled=allIds.filter(id=>{const e=entryById(id);return e&&!e.settled;});
  const existing=new Set(S.carries[toGi]);
  for(const id of unsettled)existing.add(id);
  S.carries[toGi]=[...existing];
}

function toggleOrder(dstr,type){
  if(!S.orders[dstr])S.orders[dstr]={buyId:null,sellId:null};
  const ord=S.orders[dstr];
  const key=type==='buy'?'buyId':'sellId';
  if(ord[key]!==null){
    rmFromGroups(ord[key]);ord[key]=null;
  } else {
    const price=S.prices[dstr]||null;
    const id=S.idc++;
    ord[key]=id;
    const g=S.groups[S.gi];
    const e={id,date:dstr,price,type,settled:false};
    if(type==='buy'){g.buys.push(e);g.buys.sort((a,b)=>(b.price||0)-(a.price||0));}
    else {g.sells.push(e);g.sells.sort((a,b)=>(b.price||0)-(a.price||0));}
  }
  R();
}

function rmFromGroups(id){

function parseDateStr(raw){
  if(!raw)return null;
  raw=String(raw).trim();
  if(/^\d{8}$/.test(raw))return raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
  var m=raw.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if(m)return m[1]+'-'+(m[2].length<2?'0':'')+m[2]+'-'+(m[3].length<2?'0':'')+m[3];
  return null;
}

function analyzeStockPatterns(){
  var allDates = Object.keys(S.extOHLC).sort();
  if(allDates.length < 20) return null;

  var rows = allDates.map(function(d){
    var o = S.extOHLC[d];
    var vol = S.extVol[d] || null;
    return {date:d, o:o.o, h:o.h, l:o.l, c:o.c, vol:vol};
  }).filter(function(r){ return r.c > 0; });

  var n = rows.length;
  if(n < 20) return null;

  var closes = rows.map(function(r){ return r.c; });
  var vols   = rows.map(function(r){ return r.vol; }).filter(function(v){ return v !== null; });
  var avgVol = vols.length > 0 ? vols.reduce(function(a,b){return a+b;},0)/vols.length : 0;
  var avgRange = rows.map(function(r){ return r.h-r.l; }).reduce(function(a,b){return a+b;},0)/n;

  function mk(){ return {u:0,d:0}; }
  var P = {
    volUp:mk(),volDn:mk(),bigUp:mk(),bigDn:mk(),wideUp:mk(),
    gapUp:mk(),gapDn:mk(),cont3U:mk(),cont3D:mk(),weekend:mk(),upperWick:mk(),
  };

  for(var i=1; i<n-1; i++){
    var c  = closes[i];
    var cp = closes[i-1];
    var cn = closes[i+1];
    var chg = (c - cp)/cp * 100;
    var nextUp = cn > c;
    var vol = rows[i].vol;
    var range = rows[i].h - rows[i].l;
    var gap = (rows[i].o - cp)/cp * 100;
    var body = Math.abs(c - rows[i].o);
    var upperWick = rows[i].h - Math.max(rows[i].o, c);

    if(avgVol>0 && vol && vol/avgVol>=2.0 && chg>=0){if(nextUp) P.volUp.u++; else P.volUp.d++;}
    if(avgVol>0 && vol && vol/avgVol>=2.0 && chg<0){if(nextUp) P.volDn.u++; else P.volDn.d++;}
    if(chg >= 2.0){ if(nextUp) P.bigUp.u++; else P.bigUp.d++; }
    if(chg <= -2.0){ if(nextUp) P.bigDn.u++; else P.bigDn.d++; }
    if(range >= avgRange*1.5 && chg > 0){ if(nextUp) P.wideUp.u++; else P.wideUp.d++; }
    if(gap >= 2.0){ if(nextUp) P.gapUp.u++; else P.gapUp.d++; }
    if(gap <= -2.0){ if(nextUp) P.gapDn.u++; else P.gapDn.d++; }
    if(body > 5 && upperWick >= body*2){ if(nextUp) P.upperWick.u++; else P.upperWick.d++; }
    if(i>=3 && closes[i]>closes[i-1]&&closes[i-1]>closes[i-2]&&closes[i-2]>closes[i-3]){if(nextUp) P.cont3U.u++; else P.cont3U.d++;}
    if(i>=3 && closes[i]<closes[i-1]&&closes[i-1]<closes[i-2]&&closes[i-2]<closes[i-3]){if(nextUp) P.cont3D.u++; else P.cont3D.d++;}
    if(i>0){var d0=new Date(rows[i-1].date), d1=new Date(rows[i].date);var diff=(d1-d0)/864e5;if(diff>=3){ if(cn>c) P.weekend.u++; else P.weekend.d++; }}
  }

  function pct(p){ var t=p.u+p.d; return t===0?null:Math.round(p.u/t*100); }

  function judge(p, expectUp){
    var t=p.u+p.d;
    if(t<4) return {rank:'?', color:'var(--muted)', label:'サンプル少', n:t};
    var pc = pct(p);
    if(expectUp){
      if(pc>=70) return {rank:'S', color:'#C62828', label:'強力↑'+pc+'%', n:t};
      if(pc>=60) return {rank:'A', color:'#E65100', label:'有効↑'+pc+'%', n:t};
      if(pc>=50) return {rank:'B', color:'var(--sub)', label:'やや↑'+pc+'%', n:t};
      if(pc>=40) return {rank:'C', color:'var(--sub)', label:'やや↓'+(100-pc)+'%', n:t};
      if(pc>=30) return {rank:'A', color:'#1565C0', label:'逆↓'+(100-pc)+'%', n:t};
      return {rank:'S', color:'#1565C0', label:'強逆↓'+(100-pc)+'%', n:t};
    } else {
      var dp=100-pc;
      if(dp>=70) return {rank:'S', color:'#1565C0', label:'強力↓'+dp+'%', n:t};
      if(dp>=60) return {rank:'A', color:'#E65100', label:'有効↓'+dp+'%', n:t};
      if(dp>=50) return {rank:'B', color:'var(--sub)', label:'やや↓'+dp+'%', n:t};
      if(dp>=40) return {rank:'C', color:'var(--sub)', label:'やや↑'+(100-dp)+'%', n:t};
      if(dp>=30) return {rank:'A', color:'#C62828', label:'逆↑'+(100-dp)+'%', n:t};
      return {rank:'S', color:'#C62828', label:'強逆↑'+(100-dp)+'%', n:t};
    }
  }

  return {
    n: n, avgVol: Math.round(avgVol), avgRange: Math.round(avgRange), hasVol: avgVol > 0,
    items: [
      {name:'異常出来高＋当日上昇',icon:'🔥',desc:'出来高が平均2倍超かつ当日が上昇した翌日',expect:'down',pct:pct(P.volUp),j:judge(P.volUp,false),p:P.volUp,tip:'東ソーは86%下落。この銘柄は？'},
      {name:'異常出来高＋当日下落',icon:'💧',desc:'出来高が平均2倍超かつ当日が下落した翌日',expect:'up',pct:pct(P.volDn),j:judge(P.volDn,true),p:P.volDn,tip:'大量売りの後に買い戻しが入るか？'},
      {name:'大陽線（＋2%超）',icon:'🕯️',desc:'前日比＋2%超の大陽線翌日',expect:'down',pct:pct(P.bigUp),j:judge(P.bigUp,false),p:P.bigUp,tip:'急騰翌日は反落しやすいか？'},
      {name:'大陰線（－2%超）',icon:'🕯️',desc:'前日比－2%超の大陰線翌日',expect:'up',pct:pct(P.bigDn),j:judge(P.bigDn,true),p:P.bigDn,tip:'急落翌日は反発しやすいか？'},

function applyStockData(){
  var text=S.stockPaste;
  if(!text.trim()){S.stockStat={type:'err',msg:'データを貼り付けてください'};R();return;}
  var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l;});
  var cnt=0;
  for(var i=0;i<lines.length;i++){
    var cols=lines[i].split('\t').map(function(c){return c.trim().replace(/,/g,'');});
    if(cols.length<2)continue;
    var dstr=parseDateStr(cols[0]);
    if(!dstr)continue;
    var nums=[];
    for(var ci=1;ci<cols.length;ci++){var v=parseFloat(cols[ci]);if(!isNaN(v)&&v>=0)nums.push(v);}
    if(nums.length===0)continue;
    if(nums.length===1){S.prices[dstr]=nums[0];cnt++;continue;}
    if(nums.length===2){S.prices[dstr]=nums[0];S.extVol[dstr]=nums[1];cnt++;continue;}
    if(nums.length>=4){
      var o=nums[0],h=nums[1],l=nums[2],c2=nums[3];
      var hi=Math.max(o,h,l,c2),lo=Math.min(o,h,l,c2);
      S.extOHLC[dstr]={o:o,h:hi,l:lo,c:c2};
      S.prices[dstr]=c2;
      var isMAFmt=nums.length>=6&&nums[4]>0&&Math.abs(nums[4]-c2)/c2<0.20;
      if(isMAFmt){
        var ma5imp=nums[4]||null;var ma25imp=nums[5]||null;var ma75imp=(nums.length>=7&&nums[6]>0)?nums[6]:null;
        if(ma25imp>0||ma75imp>0){
          S.extMA[dstr]={};
          if(ma5imp>0)S.extMA[dstr].ma5=ma5imp;
          if(ma25imp>0)S.extMA[dstr].ma25=ma25imp;
          if(ma75imp>0)S.extMA[dstr].ma75=ma75imp;
        }
        for(var vi=5;vi<nums.length;vi++){if(nums[vi]>c2*10){S.extVol[dstr]=nums[vi];break;}}
      } else {
        if(nums.length>=5&&nums[4]>0)S.extVol[dstr]=nums[4];
      }
      cnt++;continue;
    }
    S.prices[dstr]=nums[nums.length-1];cnt++;
  }
  var maCnt=Object.keys(S.extMA).length;
  S.stockStat=cnt>0
    ?{type:'ok',msg:'銘柄データ '+cnt+'日分 取り込み完了'+(maCnt>0?' ／ MA '+maCnt+'日分 ✅':'')}
    :{type:'err',msg:'データを解析できませんでした'};
  if(cnt>0) S.patternAnalysis = analyzeStockPatterns();
  lsSaveExt();R();
}

function candlePattern(dstr){
  var ohlc=S.extOHLC[dstr];if(!ohlc)return null;
  var o=ohlc.o,h=ohlc.h,l=ohlc.l,c=ohlc.c;
  var range=h-l;if(range===0)return 'IP';
  var body=Math.abs(c-o);var bodyR=body/range;
  var upShadow=h-Math.max(o,c);var dnShadow=Math.min(o,c)-l;
  var upR=upShadow/range;var dnR=dnShadow/range;var isBull=c>=o;
  if(bodyR<=0.05&&dnR>=0.6&&upR<=0.1)return 'TO';
  if(bodyR<=0.05&&upR>=0.6&&dnR<=0.1)return 'TB';
  if(bodyR<=0.05)return 'JU';
  if(dnR>=0.5&&bodyR<=0.2&&upR<=0.1)return 'KA';
  if(bodyR<=0.2&&upR>=0.1&&dnR>=0.1)return 'KO';
  if(upR<=0.05&&dnR<=0.05)return 'IP';
  if(isBull&&bodyR>=0.6)return 'BY';
  if(!isBull&&bodyR>=0.6)return 'BN';
  if(isBull&&dnR>=bodyR*2)return 'DY';
  if(!isBull&&upR>=bodyR*2)return 'UN';
  if(isBull&&upR>=bodyR*2)return 'UY';
  if(!isBull&&dnR>=bodyR*2)return 'DN';
  if(isBull)return 'SY';
  return 'SN';
}

function candleName(pattern){
  var names={'BY':'大陽線','SY':'小陽線','DY':'下ヒゲ陽線','UY':'上ヒゲ陽線','BN':'大陰線','SN':'小陰線','DN':'下ヒゲ陰線','UN':'上ヒゲ陰線','KA':'カラカサ','TO':'トンボ','TB':'トウバ','JU':'十字線','KO':'コマ','IP':'一本線'};
  return names[pattern]||'';
}

function detectChartPattern(series){
  var n=series.length;if(n<15)return null;
  var r=series.slice(Math.max(0,n-30));var len=r.length;
  var peaks=[],troughs=[];
  for(var i=1;i<len-1;i++){
    if(r[i]>=r[i-1]&&r[i]>=r[i+1])peaks.push({i:i,v:r[i]});
    if(r[i]<=r[i-1]&&r[i]<=r[i+1])troughs.push({i:i,v:r[i]});
  }
  var cur=r[len-1];
  if(troughs.length>=2){var t1=troughs[troughs.length-2],t2=troughs[troughs.length-1];if(Math.abs(t1.v-t2.v)/Math.max(t1.v,t2.v)<0.04&&t2.i>t1.i+3){var neck=0;for(var pi=0;pi<peaks.length;pi++)if(peaks[pi].i>t1.i&&peaks[pi].i<t2.i)neck=Math.max(neck,peaks[pi].v);if(neck>0&&cur>=neck*0.99)return{label:'📈ダブルボトム',cl:'var(--red)',bg:'var(--red-lt)'};}}
  if(peaks.length>=2){var p1=peaks[peaks.length-2],p2=peaks[peaks.length-1];if(Math.abs(p1.v-p2.v)/Math.max(p1.v,p2.v)<0.04&&p2.i>p1.i+3){var neck=Infinity;for(var ti=0;ti<troughs.length;ti++)if(troughs[ti].i>p1.i&&troughs[ti].i<p2.i)neck=Math.min(neck,troughs[ti].v);if(neck<Infinity&&cur<=neck*1.01)return{label:'📉ダブルトップ',cl:'var(--blue)',bg:'var(--blue-lt)'};}}
  return null;
}

function getPrevUnsettled(y,m){
  try{
    const raw=localStorage.getItem(prevMonthKey(y,m));if(!raw)return [];
    const d=JSON.parse(raw);const groups=d.groups||[];const settles=d.settles||{};
    const settledIds=new Set();Object.values(settles).forEach(ss=>ss.forEach(s=>settledIds.add(s.posId)));
    const entries=[];
    groups.forEach(g=>{
      (g.buys||[]).forEach(e=>{if(!e.settled&&!settledIds.has(e.id))entries.push({...e,type:'buy'});});
      (g.sells||[]).forEach(e=>{if(!e.settled&&!settledIds.has(e.id))entries.push({...e,type:'sell'});});
    });
    return entries;
  }catch(e){return [];}
}

function calcPrevMonthProfit(y,m){
  try{
    const raw=localStorage.getItem(prevMonthKey(y,m));if(!raw)return 0;
    const d=JSON.parse(raw);const groups=d.groups||[];const settles=d.settles||{};
    const sh=Math.max(Number(S.shares)||1,1);const allEntries={};
    groups.forEach(g=>{(g.buys||[]).forEach(e=>{allEntries[e.id]=e;});(g.sells||[]).forEach(e=>{allEntries[e.id]=e;});});
    let total=0;
    Object.values(settles).forEach(ss=>ss.forEach(s=>{
      const e=allEntries[s.posId];if(!e||!e.price||!s.exitPrice)return;
      total+=(e.type==='buy'?s.exitPrice-e.price:e.price-s.exitPrice)*sh;
    }));
    return Math.round(total);
  }catch(e){return 0;}
}

function applyCarryOver(y,m){
  const entries=getPrevUnsettled(y,m);if(!entries.length)return false;
  entries.forEach(e=>{
    const newId=S.idc++;const newEntry={id:newId,date:e.date,price:e.price,type:e.type,settled:false};
    if(e.type==='buy'){S.groups[0].buys.push(newEntry);S.groups[0].buys.sort((a,b)=>(b.price||0)-(a.price||0));}
    else {S.groups[0].sells.push(newEntry);S.groups[0].sells.sort((a,b)=>(b.price||0)-(a.price||0));}
  });
  return true;
}

/* ═══════════════════════ 予測的中率分析 ═══════════════════════ */
function calcPredStats(){
  var logDates=Object.keys(S.predLog).sort();
  if(logDates.length===0)return null;
  var allPriceDates=Object.keys(S.prices).sort();
  var results=[];
  for(var i=0;i<logDates.length;i++){
    var d=logDates[i];
    var pred=S.predLog[d];
    var curP=S.prices[d];
    if(!curP||!pred)continue;
    var nextP=null;
    for(var j=0;j<allPriceDates.length;j++){
      if(allPriceDates[j]>d){nextP=S.prices[allPriceDates[j]];break;}
    }
    if(!nextP)continue;
    var actualDir=nextP>curP?'up':nextP<curP?'down':null;
    if(!actualDir)continue;
    var ok=(pred.dir===actualDir);
    results.push({date:d,pred:pred,actualDir:actualDir,ok:ok,curP:curP,nextP:nextP});
  }
  if(results.length===0)return null;
  var totalOk=results.filter(function(r){return r.ok;}).length;
  var total=results.length;

  function sigStats(filterFn,label,icon){
    var rs=results.filter(filterFn);
    if(rs.length===0)return null;
    var ok2=rs.filter(function(r){return r.ok;}).length;
    var pct=Math.round(ok2/rs.length*100);
    var rank=pct>=70?'S':pct>=60?'A':'B';
    return {label:label,icon:icon,ok:ok2,total:rs.length,pct:pct,rank:rank};
  }
  function predLevel(p){var lv=classify5Level(p);return lv?lv.level:3;}

  var byLevel=[
    sigStats(function(r){return predLevel(r.pred)===5;},'📈 買い優勢',''),
    sigStats(function(r){return predLevel(r.pred)===4;},'🔼 やや強気',''),
    sigStats(function(r){return predLevel(r.pred)===3;},'⚡ 中立',''),
    sigStats(function(r){return predLevel(r.pred)===2;},'🔽 やや弱気',''),
    sigStats(function(r){return predLevel(r.pred)===1;},'📉 売り優勢',''),
  ].filter(Boolean);

  var byStars=[
    sigStats(function(r){return r.pred.stars===3;},'★★★ 高確信','⭐'),
    sigStats(function(r){return r.pred.stars===2;},'★★ 中確信',''),
    sigStats(function(r){return r.pred.stars===1;},'★ 低確信',''),
  ].filter(Boolean);

  var bySignal=[
    sigStats(function(r){return r.pred.maCross==='GC75'||r.pred.maCross==='DC75';},'MAクロス(25×75)','🌟'),
    sigStats(function(r){return r.pred.maCross==='GC25'||r.pred.maCross==='DC25';},'MAクロス(5×25)','✨'),
    sigStats(function(r){return !r.pred.maCross&&r.pred.score>=4;},'スコア高(+4以上)','💪'),
    sigStats(function(r){return !r.pred.maCross&&r.pred.score<=-4;},'スコア低(-4以下)','📉'),
    sigStats(function(r){return r.pred.bayesProb>=70;},'ベイズ70%以上','📊'),
    sigStats(function(r){return r.pred.bayesProb<=30;},'ベイズ30%以下','📊'),
    sigStats(function(r){return r.pred.isRange===true;},'レンジ相場','〰'),
    sigStats(function(r){return !r.pred.isRange&&r.pred.chop<40;},'トレンド相場','📈'),
  ].filter(Boolean);

  var timeline=results.slice(-30);

  var byMonth={};
  results.forEach(function(r){
    var ym=r.date.slice(0,7);
    if(!byMonth[ym])byMonth[ym]={ok:0,total:0};
    byMonth[ym].total++;
    if(r.ok)byMonth[ym].ok++;
  });
  var monthList=Object.keys(byMonth).sort().map(function(ym){
    var mv=byMonth[ym];return {ym:ym,pct:Math.round(mv.ok/mv.total*100),ok:mv.ok,total:mv.total};
  });

  return {total:total,totalOk:totalOk,totalPct:Math.round(totalOk/total*100),
    byLevel:byLevel,byStars:byStars,bySignal:bySignal,timeline:timeline,monthList:monthList};
}

function rPredStats(){
  var stats=calcPredStats();
  var panelId='pred-stats-body';

  // ヘッダー部分
  var hdrRight='<span style="margin-left:auto;font-size:10px;color:var(--sub)">'+(S.predStatsOpen?'▲':'▼')+'</span>';

  if(!stats){
    var emptyBody='';
    if(S.predStatsOpen){
      emptyBody='<div class="cb" style="text-align:center;padding:24px">'
        +'<div style="font-size:32px;margin-bottom:8px">📅</div>'
        +'<div style="font-weight:700;font-size:13px;margin-bottom:6px">まだデータがありません</div>'
        +'<div style="font-size:11px;color:var(--sub);line-height:1.9">'
        +'翌日更新ボタンを毎日押すと予測ログが自動蓄積されます。<br>'
        +'<b>30日分</b>でシグナルの傾向が見え始め<br>'
        +'<b>100日分</b>でかなり精度の高い分析ができます'
        +'</div></div>';
    }
    return '<div class="card">'
      +'<div class="ch" style="cursor:pointer" onclick="S.predStatsOpen=!S.predStatsOpen;R()">'
      +'<span>📊 予測的中率分析</span>'
      +'<span style="font-size:10px;color:var(--muted)">翌日更新を積み重ねるとシグナル別の当たり率がわかります</span>'
      +hdrRight+'</div>'+emptyBody+'</div>';
  }

  function pctColor(pct){return pct>=70?'var(--green)':pct>=55?'var(--orange)':'var(--red)';}
  function rankCls(rank){return rank==='S'?'ps-rank-s':rank==='A'?'ps-rank-a':'ps-rank-b';}

  function sigCard(item){
    var cl=pctColor(item.pct);
    var rankLabel=item.rank==='S'?'S：非常に信頼できる':item.rank==='A'?'A：信頼できる':'B：参考程度';
    var advice=item.pct>=70?'✅ このシグナルは信頼できます':item.pct>=55?'△ まあまあ使えます':'❌ このシグナルは効いていません';
    return '<div class="ps-card '+rankCls(item.rank)+'">'
      +'<div class="ps-head">'
      +(item.icon?'<span>'+item.icon+'</span>':'')
      +'<span>'+item.label+'</span>'
      +'<span style="margin-left:auto;font-size:9px;color:var(--sub)">'+rankLabel+'</span>'
      +'</div>'
      +'<div class="ps-body">'
      +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px">'
      +'<span class="ps-pct" style="color:'+cl+'">'+item.pct+'%</span>'
      +'<span class="ps-n">'+item.ok+'/'+item.total+'日的中</span>'
      +'</div>'
      +'<div class="ps-bar-wrap"><div class="ps-bar-fill" style="width:'+item.pct+'%;background:'+cl+'"></div></div>'
      +'<div style="font-size:9px;color:var(--sub);margin-top:3px">'+advice+'</div>'
      +'</div></div>';
  }

  function sigSection(arr, title){
    if(!arr||!arr.length)return '';
    var cards=arr.map(sigCard).join('');
    return '<div style="margin-bottom:12px">'
      +'<div style="font-size:11px;font-weight:700;color:var(--sub);padding:0 14px 6px;border-bottom:1px solid var(--border);margin-bottom:8px">'+title+'</div>'
      +'<div class="ps-grid">'+cards+'</div>'
      +'</div>';
  }

  // タイムライン
  var tlRows=stats.timeline.map(function(r){
    var dotCls=r.ok?'ps-dot-ok':'ps-dot-ng';
    var predLv=classify5Level(r.pred);
    var predLabel=predLv?predLv.emoji+predLv.label:'?';
    var chgPct=Math.round((r.nextP-r.curP)/r.curP*100*10)/10;
    var updown=r.actualDir==='up'?'↑上昇':'↓下落';
    var udcl=r.actualDir==='up'?'var(--red)':'var(--blue)';
    var hitcl=r.ok?'var(--green)':'var(--red)';
    return '<div class="ps-trow">'
      +'<div class="'+dotCls+'"></div>'
      +'<span style="color:var(--sub);min-width:38px">'+r.date.slice(5)+'</span>'
      +'<span style="min-width:88px">'+predLabel+'</span>'
      +'<span style="color:var(--sub)">→</span>'
      +'<span style="color:'+udcl+';font-weight:700">'+updown+'</span>'
      +'<span style="font-size:10px;color:'+hitcl+';">'+(r.ok?'✓的中':'✗外れ')+'</span>'
      +'<span style="font-size:10px;color:var(--sub)">('+( chgPct>=0?'+':'')+chgPct+'%)</span>'
      +'</div>';
  }).join('');

  // 月別
  var monthRows=stats.monthList.map(function(mv){
    var cl=pctColor(mv.pct);
    return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11px;border-bottom:1px solid #F5F7FA">'
      +'<span style="min-width:54px;color:var(--sub)">'+mv.ym+'</span>'
      +'<div style="flex:1;height:14px;background:#E8EDF2;border-radius:3px;overflow:hidden">'
      +'<div style="width:'+mv.pct+'%;height:100%;background:'+cl+';border-radius:3px"></div>'
      +'</div>'
      +'<span style="font-weight:700;color:'+cl+';min-width:36px">'+mv.pct+'%</span>'
      +'<span style="font-size:10px;color:var(--muted)">'+mv.ok+'/'+mv.total+'</span>'
      +'</div>';
  }).join('');

  var totalCl=pctColor(stats.totalPct);
  var advice=stats.totalPct>=65?'全体的に良好！信頼できるシグナルを中心に使いましょう':
    stats.totalPct>=50?'コイントスよりやや良い状態。Sランクシグナルだけに絞るのがおすすめ':
    '苦戦中。データを増やすか、銘柄に合ったシグナルを絞り込みましょう';
  var adviceBg=stats.totalPct>=65?'var(--green-lt)':stats.totalPct>=50?'var(--warn-lt)':'var(--red-lt)';

  // ヘッダー
  var hdr='<div class="ch" style="cursor:pointer" onclick="S.predStatsOpen=!S.predStatsOpen;R()">'
    +'<span>📊 予測的中率分析</span>'
    +'<span style="font-size:12px;font-weight:700;color:'+totalCl+'">全体 '+stats.totalPct+'%</span>'
    +'<span style="font-size:10px;color:var(--sub)">'+stats.total+'日分のデータ</span>'
    +'<span style="font-size:10px;color:var(--sub)">'+advice+'</span>'
    +hdrRight+'</div>';

  if(!S.predStatsOpen) return '<div class="card">'+hdr+'</div>';

  // サマリー
  var summary='<div style="display:flex;align-items:center;gap:20px;padding:12px 18px;background:#FAFBFC;border-bottom:1px solid var(--border);flex-wrap:wrap">'
    +'<div style="text-align:center">'
    +'<div style="font-size:36px;font-weight:900;color:'+totalCl+'">'+stats.totalPct+'%</div>'
    +'<div style="font-size:10px;color:var(--sub)">全体的中率</div>'
    +'<div style="font-size:10px;color:var(--sub)">'+stats.totalOk+'/'+stats.total+'日</div>'
    +'</div>'
    +'<div style="flex:1;min-width:160px">'
    +'<div class="ps-bar-wrap" style="height:14px">'
    +'<div class="ps-bar-fill" style="width:'+stats.totalPct+'%;background:'+totalCl+'"></div>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px">'
    +'<span>0%</span><span>コイントス(50%)</span><span>100%</span>'
    +'</div>'
    +'<div style="margin-top:8px;font-size:11px;color:var(--sub);background:'+adviceBg+';padding:5px 10px;border-radius:5px">'+advice+'</div>'
    +'</div></div>';

  // 月別セクション
  var monthSection='';
  if(stats.monthList.length>1){
    monthSection='<div style="margin-bottom:12px">'
      +'<div style="font-size:11px;font-weight:700;color:var(--sub);padding:6px 14px;border-bottom:1px solid var(--border)">📅 月別的中率の推移</div>'
      +'<div style="padding:8px 14px">'+monthRows+'</div>'
      +'</div>';
  }

  // タイムラインセクション
  var tlSection='<div>'
    +'<div style="font-size:11px;font-weight:700;color:var(--sub);padding:6px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">'
    +'<span>🕐 直近'+stats.timeline.length+'日の予測履歴</span>'
    +'<span style="font-size:10px;font-weight:400">'
    +'<span style="color:var(--green)">●的中</span>'
    +'<span style="margin-left:6px;color:var(--red)">●外れ</span>'
    +'</span></div>'
    +'<div class="ps-timeline">'+tlRows+'</div>'
    +'</div>';

  return '<div class="card">'+hdr+summary
    +sigSection(stats.byLevel,'🎯 予測レベル別の的中率')
    +sigSection(stats.byStars,'⭐ 確信度（★）別の的中率')
    +sigSection(stats.bySignal,'🔍 シグナル別の的中率')
    +monthSection+tlSection+'</div>';
}

function applyRealtimeData(){
  var dstr=parseDateStr(S.rtDate);
  if(!dstr){S.rtStat={type:'err',msg:'❌ 日付が正しくありません'};R();return;}
  var c=parseFloat(S.rtC);
  if(isNaN(c)||c<=0){S.rtStat={type:'err',msg:'❌ 終値を入力してください'};R();return;}
  S.prices[dstr]=c;
  var o=parseFloat(S.rtO),h=parseFloat(S.rtH),l=parseFloat(S.rtL);
  if(!isNaN(o)&&!isNaN(h)&&!isNaN(l)&&o>0&&h>0&&l>0){S.extOHLC[dstr]={o:o,h:h,l:l,c:c};localStorage.setItem('katotre_ohlc',JSON.stringify(S.extOHLC));}
  var vol=parseFloat(S.rtVol);
  if(!isNaN(vol)&&vol>0){S.extVol[dstr]=vol;localStorage.setItem('katotre_extvol',JSON.stringify(S.extVol));}
  var dow=parseFloat(S.rtDow);
  if(!isNaN(dow)&&dow>0){S.extDow[dstr]=dow;localStorage.setItem('katotre_extdow',JSON.stringify(S.extDow));}
  lsSave();
  S.rtStat={type:'ok',msg:'✅ '+dstr+' 反映完了'};
  R();
}

function calcThreshold(basePrice, pct){return Math.round(basePrice * (pct/100));}

function checkRulePct(dstr, type){
  if(!S.rule3On)return null;
  const same=(C.open||openEgi()).filter(e=>e.type===type&&e.price);
  if(!same.length)return null;
  const curP=S.prices[dstr]||null;if(!curP)return null;
  const pct=S.rule3Pct||3;
  let ngBase=null,ngDiff=null,ngNeed=null;
  for(const e of same){
    const base=e.price;const threshold=calcThreshold(base,pct);const diff=Math.abs(curP-base);
    if(diff<threshold){if(ngBase===null||diff<ngDiff){ngBase=base;ngDiff=Math.round(diff);ngNeed=threshold;}}
  }
  if(ngBase!==null)return {ok:false,base:ngBase,curP,diff:ngDiff,need:ngNeed,pct,type};
  const closest=same.reduce((a,b)=>Math.abs((b.price||0)-curP)<Math.abs((a.price||0)-curP)?b:a);
  const base=closest.price;const diff=Math.round(Math.abs(curP-base));const need=calcThreshold(base,pct);
  return {ok:true,base,curP,diff,need,pct,type};
}

function r3pctAlert(dstr, type){
  if(!(C.revDstrs||new Set()).has(dstr))return '';
  const r=checkRulePct(dstr,type);if(!r)return '';
  if(r.ok)return `<div style="font-size:8px;color:#0057B8;font-weight:700;line-height:1.2">+${fn(r.diff)}円</div>`;
  const remaining=r.need-r.diff;
  return `<div style="font-size:8px;color:#C62828;font-weight:700;line-height:1.2">-${fn(remaining)}円</div>`;
}

      if(e.price){
        let refP=null;
        if(e.settled&&isOwnGi){refP=C.settleExitMap&&C.settleExitMap.get(e.id)||null;}
        else if(!e.settled&&C.curP){refP=C.curP;}
        if(refP){
          const diff=colType==='buy'?refP-e.price:e.price-refP;const val=Math.round(diff*sh);const cl=val>0?'ppos':val<0?'pneg':'';
          fukumiH=`<div class="ge-fukumi ${cl}">(${val>0?'+':''}${fn(val)})</div>`;
        }
      }
      return `<div class="ge has ${e.settled&&isOwnGi?'stl':''} ${isAutoStl&&isOwnGi?'auto-stl':''} ${colType}-e">
        <div class="ged">${fd(e.date)}</div>
        <div class="gep">${e.price?fn(e.price):'&#x2014;'}</div>
        ${fukumiH}
        ${!e.settled&&isExpired?'<div class="ge-exp">&#x26A0;&#x671F;&#x9650;</div>':''}
      </div>`;
    };

    const rowsH=rows.map(r=>`
      <div style="display:grid;grid-template-columns:1fr 1fr">
        <div style="border-right:1px solid #E8EDF2">${mkCell(r.buy,'buy')}</div>
        <div>${mkCell(r.sell,'sell')}</div>
      </div>`).join('');

    return `<div class="gc ${isCur?'cur':''} ${isDone?'done':''}">
      <div class="gh">
        <span>${NUMS[gi]}</span>
        <span style="display:flex;gap:3px;align-items:center">
          ${isCur?'<span class="badge badge-orange">現在</span>':''}
          ${isDone?'<span class="badge badge-green">済</span>':''}
        </span>
      </div>
      <div class="gc-cols">
        <div class="gch buy">○買い</div>
        <div class="gch sell">×売り</div>
      </div>
      ${rowsH}
      <div style="padding:3px 5px;border-top:1px solid var(--border)">
        <input type="text" style="width:100%;font-size:10px;border:1px solid var(--border);border-radius:3px;padding:2px 5px;background:#FAFBFC"
          placeholder="メモ..."
          value="${(S.groupMemos[gi]||'').replace(/"/g,'&quot;')}"
          oninput="S.groupMemos[${gi}]=this.value">
      </div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="memo-top">
      <div class="memo-title">📋 ポジションメモ欄</div>
      <div class="memo-meta">
        <div class="ctrl"><label>元金</label>
          <input type="number" style="width:82px" value="${S.capital}" placeholder="万円" oninput="S.capital=this.value"> <span>万円</span>
        </div>
        <div class="ctrl"><label>1P株数</label>
          <input type="number" style="width:72px" value="${S.shares}" placeholder="株" oninput="S.shares=this.value"> <span>株</span>
        </div>
        <span style="font-size:12px;font-weight:700;color:var(--orange)">現在: ${NUMS[S.gi]}</span>
        <button class="btn btn-outline btn-sm" onclick="prevGrp()" ${S.gi<=0?'disabled':''}>◄前</button>
        <button class="btn btn-outline btn-sm" onclick="advGrp()" ${S.gi>=11?'disabled':''}>次►</button>
      </div>
    </div>
    <div class="g-grid">${gcards}</div>
  </div>`;
}

function rSosai(){
  const lastD=C.lastD;const curP=C.curP;const sh=C.sh;

  const open=[
    ...calcGroupDisp(S.gi,'buy').filter(e=>!e.settled).map(e=>({...e,colType:'buy'})),
    ...calcGroupDisp(S.gi,'sell').filter(e=>!e.settled).map(e=>({...e,colType:'sell'}))
  ].sort((a,b)=>(b.price||0)-(a.price||0));

  const n=Math.min(open.length,7);const pos=open.slice(0,n);const LABS='ABCDEFGHIJ'.split('');

  const buys=pos.filter(e=>e.colType==='buy');const sells=pos.filter(e=>e.colType==='sell');
  const fixedPairs=[];
  buys.forEach(b=>{sells.forEach(s=>{const diff=(s.price||0)-(b.price||0);fixedPairs.push({buy:b,sell:s,diff,type:diff>0?'rieki':diff<0?'son':'doji'});});});
  fixedPairs.sort((a,b)=>b.diff-a.diff);

  const sonTotal=fixedPairs.filter(p=>p.type==='son').reduce((s,p)=>s+p.diff*sh,0);
  const riekiTotal=fixedPairs.filter(p=>p.type==='rieki').reduce((s,p)=>s+p.diff*sh,0);

  let settledProfit=0;
  const curGiPosIds=new Set([...calcGroupDisp(S.gi,'buy'),...calcGroupDisp(S.gi,'sell')].map(e=>e.id));
  for(const dstr of Object.keys(S.settles)){
    const ss=S.settles[dstr]||[];
    for(const s of ss){
      if(!curGiPosIds.has(s.posId))continue;
      const e=entryById(s.posId);if(!e||!e.price||!s.exitPrice)continue;
      settledProfit+=(e.type==='buy'?s.exitPrice-e.price:e.price-s.exitPrice)*sh;
    }
  }

  function rFixedSection(){
    if(!fixedPairs.length)return '';
    const rows=fixedPairs.map(p=>{
      const typeLabel=p.type==='rieki'?'利益固定':p.type==='son'?'損失固定':'同値固定';
      const typeCls='kf-'+p.type;const amtCl=p.diff>0?'ppos':p.diff<0?'pneg':'';const amtVal=p.diff*sh;
      return `<div class="kf-row">
        <span class="kf-badge ${typeCls}">${typeLabel}</span>
        <span class="tb">○${fn(p.buy.price)}</span>
        <span style="color:var(--muted)">×</span>
        <span class="ts">×${fn(p.sell.price)}</span>
        <span class="kf-amount ${amtCl}" style="min-width:70px">${p.diff>=0?'+':''}${fn(amtVal)}円</span>
      </div>`;
    }).join('');
    return `<div class="kf-section">
      <div class="kf-title" style="cursor:pointer" onclick="S.fixedOpen=!S.fixedOpen;R()">
        🔒 固定判定
        <span style="margin-left:auto;font-size:10px;background:#EEF2F6;padding:1px 8px;border-radius:4px;color:var(--sub)">${S.fixedOpen?'▲ 閉じる':'▼ 詳細'}</span>
      </div>
      ${S.fixedOpen?`<div>${rows}</div>`:''}
    </div>`;
  }

  function rComboSection(){
    if(n<2)return '';
    const combos=[];
    for(let mask=0;mask<(1<<n);mask++){
      const bits=[];for(let i=0;i<n;i++) if(mask&(1<<i)) bits.push(i);
      if(bits.length>=2) combos.push(bits);
    }
    function calcCombo(bits){
      const ps=bits.map(i=>pos[i]);const label=bits.map(i=>LABS[i]).join('+');
      const bs=ps.filter(e=>e.colType==='buy');const ss=ps.filter(e=>e.colType==='sell');
      const buysSum=bs.reduce((s,e)=>s+(e.price||0),0);const sellsSum=ss.reduce((s,e)=>s+(e.price||0),0);
      const netCount=bs.length-ss.length;
      const posStr=ps.map(e=>{const cl=e.colType==='buy'?'tb':'ts';const mk=e.colType==='buy'?'○':'×';return '<span class="'+cl+'">'+mk+fn(e.price)+'</span>';}).join('<span style="color:var(--muted);margin:0 1px">+</span>');
      let resH='',sortKey=0;
      if(netCount===0){const fixed=sellsSum-buysSum;const cl=fixed>=0?'ppos':'pneg';resH='<span class="sosai-res '+cl+'">'+(fixed>=0?'+':'')+fn(fixed*sh)+'円</span>';sortKey=fixed;}
      else if(netCount>0){const be=Math.round((buysSum-sellsSum)/netCount);const ok=curP&&curP>be;const prof1=ok?Math.round((curP-be)*netCount*sh):null;resH='<span class="sosai-res '+(ok?'sosai-ok':'sosai-ng')+'">'+fn(be)+'↑'+(ok?'✓達成':'')+'</span>';sortKey=curP?(curP>be?Math.round((curP-be)*netCount*sh):-(be-curP)*netCount*sh):0;}
      else {const be=Math.round((sellsSum-buysSum)/(-netCount));const ok=curP&&curP<be;resH='<span class="sosai-res '+(ok?'sosai-ok':'sosai-ng')+'">'+fn(be)+'↓'+(ok?'✓達成':'')+'</span>';sortKey=curP?(curP<be?Math.round((be-curP)*(-netCount)*sh):-(curP-be)*(-netCount)*sh):0;}
      return {label,posStr,resH,size:bits.length,sortKey};
    }
    const bySize={};
    combos.forEach(bits=>{const r=calcCombo(bits);if(!bySize[r.size])bySize[r.size]=[];bySize[r.size].push(r);});
    Object.values(bySize).forEach(rs=>rs.sort((a,b)=>b.sortKey-a.sortKey));
    const sections=Object.entries(bySize).map(([sz,rs])=>`
      <div class="sosai-group">
        <div class="sosai-group-title" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">${sz}点相殺 (${rs.length}件)</div>
        <div class="sosai-body">
          ${rs.map(r=>`<div class="sosai-row"><span class="sosai-lbl">${r.label}</span><span class="sosai-pos">${r.posStr}</span>${r.resH}</div>`).join('')}
        </div>
      </div>`).join('');
    const legend=pos.map((e,i)=>{const cl=e.colType==='buy'?'tb':'ts';const mk=e.colType==='buy'?'○':'×';return `<span style="margin-right:8px"><b>${LABS[i]}</b>:<span class="${cl}">${mk}</span>${fd(e.date)} ${fn(e.price)}円</span>`;}).join('');
    return `<div class="kf-section" style="padding-bottom:0;border-bottom:none">
      <div class="kf-title">🔀 相殺シミュレーション <span style="font-size:10px;color:var(--sub);font-weight:400">${legend}</span>
        ${curP?`<span style="margin-left:auto;font-size:11px">現在値: <b>${fn(curP)}円</b></span>`:''}
      </div>
      <div class="sosai-wrap" style="padding:0 0 8px 0">${sections}</div>
    </div>`;
  }

  const hasContent=n>=2||fixedPairs.length>0;
  if(!hasContent)return `<div class="card"><div class="ch">⚖️ 相殺・固定管理</div><div class="cb" style="color:var(--sub);font-size:11px">未決済2件以上で表示</div></div>`;

  return `<div class="card">
    <div class="ch">⚖️ 相殺・固定管理 <span style="font-size:10px;color:var(--sub);font-weight:400">グループ ${NUMS[S.gi]}</span></div>
    ${rFixedSection()}
    ${rComboSection()}
  </div>`;
}

function rBottom(){
  const mp=monthProfit();const prev=Number(S.prevP)||0;const total=prev+Math.round(mp);
  const mcl=mp>0?'ppos':mp<0?'pneg':'';const tcl=total>0?'ppos':total<0?'pneg':'';
  return `<div class="card">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:0;border-bottom:1px solid var(--border)">
      <div style="padding:8px 16px;border-right:1px solid var(--border);display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;font-weight:700;color:var(--sub);white-space:nowrap">📊 今月利益確定</span>
        <span class="tbig ${mcl}" style="font-size:16px">${mp!==0?(mp>0?'+':'')+fn(Math.round(mp))+'円':'0円'}</span>
      </div>
      <div style="padding:8px 16px;border-right:1px solid var(--border);display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;font-weight:700;color:var(--sub);white-space:nowrap">先月までの累計</span>
        <input type="number" style="width:110px;text-align:right" value="${S.prevP}" placeholder="0" oninput="S.prevP=this.value;R()">
        <span style="font-size:12px">円</span>
      </div>
      <div style="padding:8px 16px;border-right:1px solid var(--border);display:flex;align-items:center;gap:6px">
        <span class="op" style="font-size:16px">＋</span>
        <span class="tbig ${mcl}">${fn(Math.round(mp))}円</span>
        <span class="op" style="font-size:16px">＝</span>
      </div>
      <div style="padding:8px 16px;display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;font-weight:700;color:var(--sub)">累計</span>
        <span class="tbig ${tcl}" style="font-size:20px">${fn(total)}円</span>
      </div>
    </div>
  </div>`;
}

lsLoadMeta();
lsLoadPrices();
lsLoadExt();
if(!lsLoadMonth(S.year,S.month)){
  resetMonthData();
  applyCarryOver(S.year,S.month);
  const pp=calcPrevMonthProfit(S.year,S.month);
  if(pp&&!S.prevP)S.prevP=String(pp);
}
R();
</script>
